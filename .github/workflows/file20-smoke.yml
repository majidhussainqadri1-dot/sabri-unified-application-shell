name: File 20 Minimal Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify slot source
        run: |
          set -euo pipefail
          php -l includes/class-home-feed.php
          php tests/run-file20-file21-slot-tests.php
          git diff --exit-code
