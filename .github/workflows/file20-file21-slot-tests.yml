name: File 20 and File 21 Slot Contracts

on:
  pull_request:
    paths:
      - 'includes/class-home-feed.php'
      - 'tests/run-file20-file21-slot-tests.php'
      - '.github/workflows/file20-file21-slot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l includes/class-home-feed.php
          php -l tests/run-file20-file21-slot-tests.php
      - name: Slot contracts
        run: php tests/run-file20-file21-slot-tests.php
      - name: Existing Shell tests
        run: php tools/run-tests.php
      - name: Static mutation guard
        run: |
          set -euo pipefail
          ! grep -nE '(wp_update_post|update_post\s*\()' includes/class-home-feed.php
          test -z "$(git status --porcelain --untracked-files=no)"