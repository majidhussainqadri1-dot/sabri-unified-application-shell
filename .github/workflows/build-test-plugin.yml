name: Build and Test Plugin

on:
  pull_request:
  push:
    branches:
      - main
      - build/**
      - fix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Lint every PHP file
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check assets/js/shell.js

      - name: Run WordPress stub/bootstrap tests and static validations
        run: |
          php tools/run-tests.php --report=release/20-sabri-unified-application-shell-1.0.1-TEST-REPORT.md
          php tests/run-file20-file21-slot-tests.php
          php tests/run-file20-create-producer-tests.php
          php tests/run-file20-create-roleless-tests.php

      - name: Validate JSON where applicable
        run: |
          if find . -name '*.json' -not -path './vendor/*' -not -path './node_modules/*' | grep -q .; then
            find . -name '*.json' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1])); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, $argv[1] . ": " . json_last_error_msg() . PHP_EOL); exit(1); }'
          else
            echo "No JSON files found."
          fi

      - name: Build candidate ZIP, SHA-256, and report
        env:
          SOURCE_DATE_EPOCH: 1785283200
        run: php tools/build-release.php

      - name: Verify reproducible candidate bytes
        env:
          SOURCE_DATE_EPOCH: 1785283200
        run: |
          set -euo pipefail
          cp release/20-sabri-unified-application-shell-1.0.1.zip /tmp/file20-first.zip
          cp release/20-sabri-unified-application-shell-1.0.1.sha256 /tmp/file20-first.sha256
          php tools/build-release.php
          cmp /tmp/file20-first.zip release/20-sabri-unified-application-shell-1.0.1.zip
          cmp /tmp/file20-first.sha256 release/20-sabri-unified-application-shell-1.0.1.sha256

      - name: Verify exact candidate filenames
        run: |
          test -f release/20-sabri-unified-application-shell-1.0.1.zip
          test -f release/20-sabri-unified-application-shell-1.0.1.sha256
          test -f release/20-sabri-unified-application-shell-1.0.1-TEST-REPORT.md
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Verify ZIP CRC, path traversal, and one top-level folder
        run: |
          php -r '
          $zip = new ZipArchive();
          $path = "release/20-sabri-unified-application-shell-1.0.1.zip";
          if (true !== $zip->open($path, ZipArchive::CHECKCONS)) {
              fwrite(STDERR, "ZIP CRC check failed\n");
              exit(1);
          }
          $tops = [];
          for ($i = 0; $i < $zip->numFiles; $i++) {
              $name = $zip->getNameIndex($i);
              if (strpos($name, "../") !== false || strpos($name, "/") === 0) {
                  fwrite(STDERR, "Path traversal found: {$name}\n");
                  exit(1);
              }
              $tops[strtok($name, "/")] = true;
          }
          $zip->close();
          if (array_keys($tops) !== ["sabri-unified-application-shell"]) {
              fwrite(STDERR, "ZIP top-level folder mismatch\n");
              exit(1);
          }
          '

      - name: Upload candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sabri-unified-application-shell-1.0.1-candidate
          path: |
            release/20-sabri-unified-application-shell-1.0.1.zip
            release/20-sabri-unified-application-shell-1.0.1.sha256
            release/20-sabri-unified-application-shell-1.0.1-TEST-REPORT.md
          if-no-files-found: error

  php74-production-compatibility:
    name: PHP 7.4 production package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Lint every production PHP file shipped in the plugin
        shell: bash
        run: |
          set -euo pipefail
          php -l sabri-unified-application-shell.php
          php -l uninstall.php
          find includes admin -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
