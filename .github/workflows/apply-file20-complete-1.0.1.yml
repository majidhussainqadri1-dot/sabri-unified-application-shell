name: Apply File 20 Complete 1.0.1 Consolidation

on:
  push:
    branches:
      - fix/file20-complete-1.0.1-create-producer
    paths:
      - 'patches/file20-complete-1.0.1-create-producer.patch'
      - 'tests/run-file20-create-producer-tests.php'
      - '.github/workflows/apply-file20-complete-1.0.1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file20-complete-1.0.1-consolidation
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply guarded consolidation patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/file20-complete-1.0.1-create-producer
          fetch-depth: 0
          persist-credentials: true

      - name: Apply complete-source patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'Version: 1.0.1' sabri-unified-application-shell.php; then
            echo 'File 20 v1.0.1 patch is already applied.'
            exit 0
          fi

          test "$(git hash-object includes/class-renderer.php)" = 'd167cc1eb8c11006a934057b7a478c9fc78f86a3'
          test "$(git hash-object sabri-unified-application-shell.php)" = 'a0dbf49e77ecb544015e747fd9353bafc983405f'
          test "$(git hash-object README.md)" = '0c5a77d8b28c72ff7ed7209e2b4e283bc6054240'
          test "$(git hash-object readme.txt)" = '2b8c21b298074009f8bb9ba96d9cf80325795c0c'
          test "$(git hash-object tools/run-tests.php)" = '75235dc33adb19ae46528a54761162b2533b7b98'

          git apply --check patches/file20-complete-1.0.1-create-producer.patch
          git apply patches/file20-complete-1.0.1-create-producer.patch

      - name: Verify PHP syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './release/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tools/run-tests.php
          php tests/run-file20-file21-slot-tests.php
          php tests/run-file20-create-producer-tests.php

      - name: Commit complete source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes require a commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-application-shell.php includes/class-renderer.php README.md readme.txt CHANGELOG.md tools/run-tests.php
          git commit -m 'Complete File 20 v1.0.1 Create producer contract'
          git push origin HEAD:fix/file20-complete-1.0.1-create-producer
