name: Files 20 21 22 Pinned Convergence Contract

on:
  pull_request:
    paths:
      - 'sabri-unified-application-shell.php'
      - 'includes/class-create-visibility.php'
      - 'includes/class-defaults.php'
      - 'includes/class-plugin.php'
      - 'includes/class-renderer.php'
      - 'includes/class-safe-mode.php'
      - 'includes/class-settings.php'
      - 'tests/run-file20-file22-real-shell-contract-tests.php'
      - '.github/workflows/files20-21-22-convergence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: files20-21-22-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-convergence:
    name: Pinned convergence (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Check out exact File 20 PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: file20
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact reviewed File 21 corrective source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: majidhussainqadri1-dot/sabri-complete-home-news-feed
          ref: a9bf99ab0169dd56fe664f6a1540a5de6031d518
          path: file21
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact reviewed File 22 Phase 22E source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: majidhussainqadri1-dot/sabri-universal-post-composer
          ref: 9aed674344c33b8756b65e7bc58c223ac6ffc4ae
          path: file22
          fetch-depth: 1
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify all source pins and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file20 rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C file21 rev-parse HEAD)" = "a9bf99ab0169dd56fe664f6a1540a5de6031d518"
          test "$(git -C file22 rev-parse HEAD)" = "9aed674344c33b8756b65e7bc58c223ac6ffc4ae"

          php -l file20/includes/class-create-visibility.php
          php -l file20/tests/run-file20-file22-real-shell-contract-tests.php

          php -l file21/includes/class-universal-composer-workflow-store.php
          php -l file21/includes/class-universal-composer-workflow-adapter.php
          php -l file21/includes/class-universal-composer-publication-adapter.php
          php -l file21/tests/run-file21-file22-real-contract-tests.php
          php -l file21/tests/run-file21-file22-maintenance-tests.php
          php -l file21/tests/run-file21-file22-lock-maintenance-tests.php

          php -l file22/includes/contracts/interface-adapter.php
          php -l file22/includes/contracts/interface-diagnostic-adapter.php
          php -l file22/includes/contracts/interface-workflow-adapter.php
          php -l file22/includes/core/class-permission-resolver.php
          php -l file22/includes/core/class-registry.php
          php -l file22/includes/core/class-workflow-coordinator.php
          php -l file22/includes/integration/class-shell-bridge.php

      - name: Run actual File 20 producer with selected File 22 source
        shell: bash
        env:
          FILE22_ROOT: ${{ github.workspace }}/file22
        run: php file20/tests/run-file20-file22-real-shell-contract-tests.php

      - name: Run actual File 21 adapter with selected File 22 coordinator
        shell: bash
        env:
          FILE22_ROOT: ${{ github.workspace }}/file22
        run: php file21/tests/run-file21-file22-real-contract-tests.php

      - name: Run File 21 bounded workflow maintenance contracts
        shell: bash
        run: |
          set -euo pipefail
          php file21/tests/run-file21-file22-maintenance-tests.php
          php file21/tests/run-file21-file22-lock-maintenance-tests.php
